name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Build and serve the starter
        env:
          LEAFBOOK_ROOT: examples/starter
          LEAFBOOK_PORT: "3999"
        run: |
          npm run build
          node bin/leafbook.mjs start > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3999/Welcome > /dev/null && break
            sleep 1
          done
          for route in "" Welcome "Field%20Notes" archive/First%20Draft "search?q=trail" maps/trail.svg; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" "http://127.0.0.1:3999/$route")
            echo "$code /$route"
            test "$code" = 200
          done
